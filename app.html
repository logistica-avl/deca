<script>
/* Generador QR propio (modo byte, corrección M o L). Basado en el algoritmo de referencia de la norma ISO/IEC 18004. */
const QR=(()=>{
const ECC=[[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]];
const NB=[[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]];
const FMT=[1,0];// L=1, M=0
const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
const dataCw=(v,e)=>Math.floor(raw(v)/8)-ECC[e][v]*NB[e][v];
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
function rsRem(data,div){const r=new Array(div.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r}
function encode(text,eclPref=1){
  const bytes=Array.from(new TextEncoder().encode(text));
  let v,e=eclPref;
  const fits=(v,e)=>4+(v<=9?8:16)+8*bytes.length<=dataCw(v,e)*8;
  outer:for(const ee of eclPref===1?[1,0]:[0]){for(v=1;v<=40;v++)if(fits(v,ee)){e=ee;break outer}}
  if(v>40)throw new Error("Datos demasiado largos para un QR");
  const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(bytes.length,v<=9?8:16);bytes.forEach(b=>put(b,8));
  const cap=dataCw(v,e)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
  // bloques + ECC
  const nb=NB[e][v],el=ECC[e][v],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),div=rsDiv(el),blocks=[];
  for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+sl-el+(i<ns?0:1));k+=dat.length;const ecc=rsRem(dat,div);if(i<ns)dat.push(0);blocks.push(dat.concat(ecc))}
  const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)cw.push(b[i])});
  // matriz
  const n=v*4+17,M=[...Array(n)].map(()=>new Array(n).fill(false)),F=[...Array(n)].map(()=>new Array(n).fill(false));
  const sf=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
  for(let i=0;i<n;i++){sf(6,i,i%2===0);sf(i,6,i%2===0)}
  const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<n&&yy>=0&&yy<n)sf(xx,yy,d!==2&&d!==4)}};
  finder(3,3);finder(n-4,3);finder(3,n-4);
  const ap=[];if(v>1){const na=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2;ap.push(6);for(let p=n-7;ap.length<na;p-=step)ap.splice(1,0,p)}
  ap.forEach((a,i)=>ap.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
  const fmt=mask=>{const d=FMT[e]<<3|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412,g=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)sf(8,i,g(i));sf(8,7,g(6));sf(8,8,g(7));sf(7,8,g(8));for(let i=9;i<15;i++)sf(14-i,8,g(i));
    for(let i=0;i<8;i++)sf(n-1-i,8,g(i));for(let i=8;i<15;i++)sf(8,n-15+i,g(i));sf(8,n-8,true)};
  fmt(0);
  if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)===1,a=n-11+i%3,c=Math.floor(i/3);sf(a,c,bit);sf(c,a,bit)}}
  let i=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let vv=0;vv<n;vv++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?n-1-vv:vv;if(!F[y][x]&&i<cw.length*8){M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1;i++}}}
  const MK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply=m=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&MK[m](x,y))M[y][x]=!M[y][x]};
  const penalty=()=>{let p=0,dark=0;
    for(let y=0;y<n;y++){for(const line of[0,1]){let run=1;for(let x=1;x<n;x++){const a=line?M[x-1][y]:M[y][x-1],b=line?M[x][y]:M[y][x];if(a===b){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}}
    for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(M[y][x])dark++;
      if(x+6<n){const s=[1,0,1,1,1,0,1].every((b,k)=>M[y][x+k]===!!b);if(s&&((x>=4&&!M[y][x-1]&&!M[y][x-2]&&!M[y][x-3]&&!M[y][x-4])||(x+10<n&&!M[y][x+7]&&!M[y][x+8]&&!M[y][x+9]&&!M[y][x+10])))p+=40}
      if(y+6<n){const s=[1,0,1,1,1,0,1].every((b,k)=>M[y+k][x]===!!b);if(s&&((y>=4&&!M[y-1][x]&&!M[y-2][x]&&!M[y-3][x]&&!M[y-4][x])||(y+10<n&&!M[y+7][x]&&!M[y+8][x]&&!M[y+9][x]&&!M[y+10][x])))p+=40}}
    p+=Math.floor(Math.abs(dark*20-n*n*10)/(n*n))*10;return p};
  let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);fmt(m);const p=penalty();if(p<bp){bp=p;best=m}apply(m)}
  apply(best);fmt(best);
  return{getModuleCount:()=>n,isDark:(r,c)=>M[r][c],version:v,ecl:e===0?"L":"M"};
}
return{encode};
})();
</script>

/* Layout: una columna de trabajo (máx. 860px), barra de pasos arriba, acciones abajo. Estética de albarán: tinta petróleo + ámbar de señalización. */

  --accent:#5fb6c4; --accent-soft:#1b3337; --amber:#f0b429; --amber-soft:#3a2f12;

:root[data-theme="dark"]{

  --accent:#5fb6c4; --accent-soft:#1b3337; --amber:#f0b429; --amber-soft:#3a2f12;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 clamp(1.5rem,4vw,2rem)/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.docno{font:700 .8rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.legal{font-size:.82rem;color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.role b{font-family:var(--f-display);display:block}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--muted);font:600 .72rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;gap:6px}
.step::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.step.done::before,.step.cur::before{background:var(--accent)}
.step.cur{color:var(--ink)}
.step span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font:800 1.25rem var(--f-display);margin:0;text-transform:uppercase;letter-spacing:.02em}

.f{display:flex;flex-direction:column;gap:5px;min-width:0}

.msg.e{color:var(--err)} .msg.w{color:var(--amber)} .msg.i{color:var(--muted)}

.btn.sm{padding:6px 10px;font-size:.8rem}

.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.notice.e{background:var(--err-soft);border-color:var(--err)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sum section{padding:14px;border-bottom:1px solid var(--line);min-width:0}
.sum section:nth-child(odd){border-right:1px solid var(--line)}
.sum .wide{grid-column:1/-1;border-right:0!important}
.sum h4{margin:0 0 6px;font:700 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sum p{margin:0;overflow-wrap:anywhere}
.plate{font:700 .95rem var(--f-mono);border:1.5px solid var(--ink);border-radius:4px;padding:1px 8px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{font:700 .9rem var(--f-body);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
#nuevo{display:flex;flex-direction:column;gap:18px}
.arow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"d b" "m m";gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.arow .d{grid-area:d}.arow .m{grid-area:m}.arow .b{grid-area:b}
.arow .plate{white-space:nowrap}
.arow .d{font:700 .8rem var(--f-mono);font-variant-numeric:tabular-nums}
.arow .m{min-width:0;overflow-wrap:anywhere;font-size:.88rem}
.arow .b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.toast{font-size:.88rem;color:var(--ok);font-weight:600}
.qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:14px}
.qrbox canvas{background:#fff;border-radius:6px;max-width:100%;height:auto;image-rendering:pixelated}
.qrbox>div{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 280px}
.qrbox pre{margin:0;font:500 .72rem/1.4 var(--f-mono);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:620px){.grid,.roles,.sum{grid-template-columns:1fr}.sum section{border-right:0!important}.step span{display:none}.qrbox canvas{margin-inline:auto}.qrbox{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function empty(){return{role:"transportista",cargador:blankParty(),transportista:blankParty(),origenIgual:true,origen:blankParty(),entregas:[blankEntrega()],veh:{tractora:"",rem:"",rem2:"",conductor:"",aut:""},fecha:today,hora:"",obs:"",precio:""};}

/* ---------- Validaciones ---------- */
const L="TRWAGMYFPDXBNJZSQVHLCKE";
function checkId(v){
  v=(v||"").toUpperCase().replace(/[\s-]/g,"");
  if(!v)return{ok:false,msg:""};
  if(/^\d{8}[A-Z]$/.test(v))return L[+v.slice(0,8)%23]===v[8]?{ok:true,t:"NIF"}:{ok:false,msg:"NIF: la letra no corresponde (debería ser "+L[+v.slice(0,8)%23]+")"};
  if(/^[XYZ]\d{7}[A-Z]$/.test(v)){const n=+("XYZ".indexOf(v[0])+v.slice(1,8));return L[n%23]===v[8]?{ok:true,t:"NIE"}:{ok:false,msg:"NIE: la letra no corresponde"}}
  if(/^[ABCDEFGHJNPQRSUVW]\d{7}[0-9A-J]$/.test(v)){
    const d=v.slice(1,8);let s=0;
    for(let i=0;i<7;i++){let n=+d[i];if(i%2===0){n*=2;n=Math.floor(n/10)+n%10}s+=n}
    const c=(10-s%10)%10,cl="JABCDEFGHI"[c],last=v[8];
    const okv="PQRSNW".includes(v[0])?last===cl:"ABEH".includes(v[0])?last===String(c):(last===String(c)||last===cl);
    return okv?{ok:true,t:"CIF"}:{ok:false,msg:"CIF: el dígito de control no cuadra (debería ser "+("PQRSNW".includes(v[0])?cl:c)+")"};
  }
  return{ok:false,msg:"Formato no reconocido (NIF 12345678Z, NIE X1234567L o CIF B12345674)"};
}
function checkCP(v){
  if(!v)return{ok:false,msg:""};
  if(!/^\d{5}$/.test(v))return{ok:false,msg:"El código postal tiene 5 dígitos"};
  const p=PROV[v.slice(0,2)];return p?{ok:true,prov:p}:{ok:false,msg:"Código postal inexistente en España"};
}
function norm(s){return(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim()}
function cpVsPob(cp,pob){const r=checkCP(cp);if(!r.ok||!pob)return"";const p=norm(r.prov),q=norm(pob);
  const capitals={valencia:"valencia",alicante:"alicante",castellon:"castellon",madrid:"madrid",barcelona:"barcelona",sevilla:"sevilla",zaragoza:"zaragoza",valladolid:"valladolid",malaga:"malaga",murcia:"murcia",bilbao:"bizkaia"};
  const cap=capitals[q.replace(/ de la plana| de los .*/,"")];
  if(cap&&cap!==p)return"El CP "+cp+" es de "+r.prov+", pero la población es "+pob;
  return"";}
function checkPlate(v){v=(v||"").toUpperCase().replace(/[\s-]/g,"");if(!v)return{ok:false,msg:""};
  if(/^\d{4}[BCDFGHJKLMNPRSTVWXYZ]{3}$/.test(v))return{ok:true};
  if(/^R\d{4}[BCDFGHJKLMNPRSTVWXYZ]{3}$/.test(v))return{ok:true};
  if(/^[A-Z]{1,2}\d{4}[A-Z]{0,2}$/.test(v))return{ok:true,warn:"Formato provincial antiguo"};
  return{ok:true,warn:"No parece una matrícula española (0000BCD; sin vocales, Ñ ni Q)"};}

/* Devuelve {errors:[{path,msg}], warns:[msg]} */
function validate(){
  const E=[],W=[];
  const party=(o,base,label,reqNif)=>{
    if(!o.nombre.trim())E.push({p:base+".nombre",m:"Falta el nombre"});
    if(reqNif){const r=checkId(o.nif);if(!o.nif.trim())E.push({p:base+".nif",m:"Falta el NIF/CIF"});else if(!r.ok)W.push({p:base+".nif",m:label+" · "+r.msg})}
    else if(o.nif.trim()){const r=checkId(o.nif);if(!r.ok)W.push({p:base+".nif",m:label+" · "+r.msg})}
    const c=checkCP(o.cp);if(!o.cp.trim())E.push({p:base+".cp",m:"Falta el código postal"});else if(!c.ok)E.push({p:base+".cp",m:c.msg});
    if(!o.pob.trim())E.push({p:base+".pob",m:"Falta la población"});
    const x=cpVsPob(o.cp,o.pob);if(x)W.push({p:base+".cp",m:label+" · "+x});
  };
  party(S.cargador,"cargador","Cargador",true);
  party(S.transportista,"transportista","Transportista",true);
  if(!S.origenIgual)party(S.origen,"origen","Origen",false);
  S.entregas.forEach((e,i)=>{const b="entregas."+i;
    if(!e.igual){const c=checkCP(e.cp);if(!e.cp.trim())E.push({p:b+".cp",m:"Falta el código postal"});else if(!c.ok)E.push({p:b+".cp",m:c.msg});
      if(!e.pob.trim())E.push({p:b+".pob",m:"Falta la población"});
      const x=cpVsPob(e.cp,e.pob);if(x)W.push({p:b+".cp",m:"Entrega #"+(i+1)+" · "+x});
      if(e.nif.trim()){const r=checkId(e.nif);if(!r.ok)W.push({p:b+".nif",m:"Entrega #"+(i+1)+" · "+r.msg})}}
    if(!e.merc.trim())E.push({p:b+".merc",m:"Describe la mercancía"});
    if(!e.peso||!(+e.peso>0))E.push({p:b+".peso",m:"Indica un peso mayor que 0"});
    if(!e.fecha)E.push({p:b+".fecha",m:"Falta la fecha prevista de descarga"});
    if(!e.hora)E.push({p:b+".hora",m:"Falta la hora prevista de descarga"});
    if(e.fecha&&S.fecha&&(e.fecha+" "+(e.hora||"99:99"))<(S.fecha+" "+(S.hora||"00:00")))W.push({p:b+".fecha",m:"Entrega #"+(i+1)+" · La descarga es anterior a la hora prevista de carga"});
  });
  const t=checkPlate(S.veh.tractora);if(!S.veh.tractora.trim())E.push({p:"veh.tractora",m:"Falta la matrícula de la cabeza tractora"});else if(t.warn)W.push({p:"veh.tractora",m:"Cabeza tractora · "+t.warn});
  ["rem","rem2"].forEach(k=>{if(S.veh[k].trim()){const r=checkPlate(S.veh[k]);if(r.warn&&!/^R/i.test(S.veh[k]))W.push({p:"veh."+k,m:"Remolque · "+r.warn})}});
  if(!S.fecha)E.push({p:"fecha",m:"Falta la fecha de inicio"});
  const pr=String(S.precio??"").replace(",",".");if(!pr.trim())E.push({p:"precio",m:"Indica el precio del transporte"});else if(!(+pr>=0))E.push({p:"precio",m:"El precio debe ser un número"});
  if(!S.hora)E.push({p:"hora",m:"Falta la hora prevista de carga"});
  return{E,W};
}
const stepOf=p=>p.startsWith("cargador")||p.startsWith("transportista")?0:p.startsWith("origen")||p.startsWith("entregas")?2:p.startsWith("veh")?3:1;

function bind(){
  document.querySelectorAll("[data-p]").forEach(el=>{
    el.addEventListener("input",()=>{let v=el.value;if(el.classList.contains("mono"))v=v.toUpperCase();set(el.dataset.p,v);
      if(el.dataset.p.endsWith(".nombre")){const h=el.closest(".entrega")?.querySelector(".ehead b");if(h){const i=+el.dataset.p.split(".")[1];h.textContent="Entrega #"+(i+1)+(v?": "+v:"")}}
      markEdited();save();updateMsgs();});
  });
  document.querySelectorAll("[data-c]").forEach(el=>el.addEventListener("change",()=>{set(el.dataset.c,el.checked);markEdited();save();renderStep()}));
  document.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{S.entregas.splice(+el.dataset.del,1);save();renderStep()}));
  $("#add")?.addEventListener("click",()=>{S.entregas.push(blankEntrega());save();renderStep()});
}
function markEdited(){}
function updateMsgs(){
  const {E,W}=validate();
  document.querySelectorAll("[data-m]").forEach(m=>{
    const p=m.dataset.m,inp=document.querySelector(`[data-p="${p}"]`),e=E.find(x=>x.p===p),w=W.find(x=>x.p===p);
    let txt="",cls="msg";
    const val=get(p);
    if(e&&(showErr||(val&&String(val).trim()))){txt=e.m;cls+=" e"}
    else if(w){txt=w.m.split(" · ").slice(1).join(" · ");cls+=" w"}
    else if(p==="precio"){txt=String(val||"").trim()?(precioVa()?"Se imprimirá en el documento: "+fmtEur(precioNum()):"No supera 150 €: no se imprime en el documento."):"Si supera 150 € se imprime en el documento.";cls+=" i"}
    else if(p.endsWith(".cp")){const r=checkCP(val);if(r.ok){txt="Provincia: "+r.prov;cls+=" i"}}
    else if(p.endsWith(".nif")&&val){const r=checkId(val);if(r.ok){txt=r.t+" válido";cls+=" i"}}
    m.className=cls;m.textContent=txt;
    inp?.classList.toggle("bad",!!(e&&(showErr||(val&&String(val).trim()))));
  });
}

function drawQr(cv,size=300,mod=0){
  const q=makeQr(),n=q.getModuleCount(),m=4,s=mod||Math.floor(size/(n+2*m))||1,full=s*(n+2*m);
  cv.dataset.cells=n+2*m;

  c.fillStyle="#fff";c.fillRect(0,0,full,full);c.fillStyle="#000";

  return cv;
}

async function ghUpload(blob,name,repo="deca"){
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
  const api="https://api.github.com/repos/"+GH.user+"/"+repo+"/contents/"+name.split("/").map(encodeURIComponent).join("/");
  const hdr={Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json"};
  let sha;try{const g=await fetch(api,{headers:hdr,cache:"no-store"});if(g.ok)sha=(await g.json()).sha}catch(e){}
  const r=await fetch(api,{method:"PUT",headers:hdr,body:JSON.stringify(Object.assign({message:"Documento "+name,content:b64},sha?{sha}:{}))});
  if(r.ok)return;
  if(r.status===401)throw new Error("La clave de GitHub no es correcta o ha caducado.");
  if(r.status===403||r.status===404)throw new Error("La clave de GitHub no tiene permiso para escribir en el repositorio "+repo+".");
  throw new Error("GitHub respondió con error "+r.status+".");
}

}

const ghHdr=()=>({Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json"});
let arcList=null;
async function loadArchive(){
  const r=await fetch("https://api.github.com/repos/"+GH.user+"/deca-archivo/git/trees/HEAD?recursive=1",{headers:ghHdr(),cache:"no-store"});
  if(r.status===401)throw new Error("La clave de GitHub no es correcta o ha caducado.");
  if(r.status===404)throw new Error("No encuentro el repositorio deca-archivo, o la clave no tiene permiso para leerlo.");
  if(r.status===409)return[];
  if(!r.ok)throw new Error("GitHub respondió con error "+r.status+".");
  const j=await r.json();
  return j.tree.filter(x=>x.type==="blob"&&/DC-\d{8}-.*\.pdf$/.test(x.path)).map(x=>{
    const f=x.path.split("/").pop().replace(/\.pdf$/,""),[base,mat,carg,dest,orig]=f.split("__"),dm=base.match(/DC-(\d{4})(\d{2})(\d{2})-(\d+)/);
    return{path:x.path,file:(mat&&carg&&dm)?cleanCliente(carg.replace(/-/g," "))+"_"+mat+"_"+fmtFile(dm[1],dm[2],dm[3])+".pdf":f.split("__")[0]+".pdf",orig:(orig||"").replace(/-/g," "),fecha:dm?dm[3]+"/"+dm[2]+"/"+dm[1]:"",orden:dm?dm[1]+dm[2]+dm[3]+dm[4]:"",no:dm?"DC-"+dm[1]+dm[2]+dm[3]+"-"+dm[4]:base,mat:mat||"",carg:(carg||"").replace(/-/g," "),dest:(dest||"").replace(/-/g," ")};
  }).sort((a,b)=>b.orden.localeCompare(a.orden));
}

function paintList(){

  doc.setDrawColor(...mut);doc.line(M,y,M+half-10,y);doc.line(M+half+4,y,M+W-10,y);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...mut);
  doc.text("Firma y sello del cargador contractual",M,y+4);doc.text("Firma y sello del transportista efectivo",M+half+4,y+4);
  try{const qc=drawQr(document.createElement("canvas"),900);doc.addImage(qc.toDataURL("image/png"),"PNG",210-M-40,y-50,40,40,"qr","FAST");
    doc.setFontSize(6.5);doc.text((ghOk()?"Escanear para descargar":"Datos del documento"),210-M-20,y-8.5,{align:"center"});}catch(e){}
  doc.setFontSize(7);doc.text("Documento generado con un prototipo. Comprueba que cumple la normativa vigente antes de usarlo en carretera.",M,290);
  return doc;
}
function showShare(){
  const a=$(".actions:last-of-type")||$("#toast").parentNode;if($("#share"))return;
  const b=document.createElement("button");b.className="btn pri";b.type="button";b.id="share";b.textContent="Enviar al chófer (WhatsApp…)";b.addEventListener("click",sharePdf);
  $("#toast").parentNode.prepend(b);
  const d=document.createElement("button");d.className="btn";d.type="button";d.id="dlpdf";d.textContent="Descargar PDF";
  d.addEventListener("click",async()=>{try{await saveBlob(lastPdf.nice,lastPdf.blob)}catch(e){}});b.after(d);
}
async function createPdf(){
  const {E}=validate();const t=$("#toast");
  if(E.length){showErr=true;renderSummary();return}
  if(!ghOk()){t.style.color="var(--err)";t.textContent="Escribe tu usuario de GitHub en el recuadro del QR antes de crear el PDF.";$("#f-gh")?.focus();return}
  let renum="";
  if(!inClaude()&&GH.token&&S.subidoSig&&S.subidoSig!==dataSig()){const old=docNo;newDoc();paintQr();renum="Has cambiado datos de un documento ya enviado ("+old+"): se crea uno nuevo, "+docNo+". ";}
  let doc;try{doc=buildPdf()}catch(err){t.style.color="var(--err)";t.textContent="No se pudo generar el PDF: "+err.message;return}
  const blob=doc.output("blob"),name=pdfName(),url=ghUrl();
  lastPdf={blob,name,nice:niceName(),url,no:docNo};
  if(!inClaude()&&GH.token){
    let dlOk=true;try{await saveBlob(lastPdf.nice,blob)}catch(e){dlOk=false}
    const dlMsg=dlOk?"PDF descargado ("+esc(lastPdf.nice)+"). ":"";
    const sig=dataSig();
    if(sig===S.subidoSig){t.style.color="";t.innerHTML="✓ "+dlMsg+"Ya estaba subido, no se vuelve a subir.";showShare();return}
    const nx=$("#next");nx.disabled=true;
    try{
      t.style.color="var(--muted)";t.textContent=dlMsg+"Subiendo el PDF…";
      const [pub,arc]=await Promise.allSettled([ghUpload(blob,name),ghUpload(blob,arcPath(),"deca-archivo")]);
      if(pub.status==="rejected")throw pub.reason;
      S.subidoSig=sig;save();
      const arcMsg=arc.status==="fulfilled"?" Copia guardada en el archivo.":"<br><span style=\"color:var(--err)\">No se guardó la copia en el archivo: "+esc(arc.reason?.message||"")+"</span>";
      t.style.color="";t.innerHTML=esc(renum)+"✓ "+dlMsg+"PDF subido. Ya puedes enviarlo."+arcMsg+'<br><span id="qrst" class="opt">El QR se activa en 1–2 minutos (lo publica GitHub). Comprobando…</span>';
      showShare();
      const myNo=docNo;
      waitLive(url,i=>{const s=$("#qrst");if(s&&docNo===myNo)s.textContent="El QR se activa en 1–2 minutos (lo publica GitHub). Comprobando… "+(i*10)+" s"}).then(ok=>{
        const s=$("#qrst");if(!s||docNo!==myNo)return;
        s.style.color=ok?"var(--ok)":"var(--amber)";s.style.fontWeight="600";
        s.textContent=ok?"✓ QR activo.":"El QR aún no responde. Pruébalo en unos minutos.";
      });
    }catch(e){t.style.color="var(--err)";t.textContent=e.message||"No se pudo subir el PDF."}
    finally{nx.disabled=false}
    return;
  }
  try{await saveBlob(name,blob);t.style.color="";t.textContent="PDF "+name+" guardado."+(inClaude()?"":" Súbelo a GitHub o configura la subida automática.");if(!inClaude())showShare()}
  catch(e){t.style.color="var(--muted)";t.textContent=e.code==="declined"?"Descarga cancelada.":"No se pudo guardar el PDF ("+(e.code||e.message)+")."}
}
(()=>{const h=location.hash.slice(1);
  if(h.length>30){try{const a=JSON.parse(fromB64u(h));if(Array.isArray(a)&&a[0]===1){showVerify(a);return}}catch(e){}}
  if(!inClaude()){$("#tabs").hidden=false;document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)))}
  if(!inClaude()&&S.subidoSig){freshDoc();save()}
  draw();})();
